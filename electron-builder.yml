appId: com.naibi.app
productName: Naibi
copyright: Copyright © 2026 Luca
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!{docs,examples,todo,scripts,skill,bin}/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: naibi
  # comando naibi da terminale e per gli agenti IA, accanto a naibi.exe (vedi docs/cli.md)
  extraFiles:
    - from: build/win/naibi-cli.cmd
      to: naibi-cli.cmd
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
portable:
  artifactName: ${productName}-${version}-windows-portable.${ext}
nsis:
  artifactName: ${productName}-${version}-windows-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch: [arm64, x64]
  # senza certificato Apple: firma ad hoc, necessaria perché l'app si avvii sui Mac con chip Apple
  identity: '-'
  hardenedRuntime: false
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Naibi opens and saves projects in your Documents folder.
    - NSDownloadsFolderUsageDescription: Naibi opens and saves projects in your Downloads folder.
  notarize: false
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  executableName: naibi
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  maintainer: Luca
  category: Graphics
  synopsis: Create cards and other game components
appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
deb:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
npmRebuild: false
publish: null
