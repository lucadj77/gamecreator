# Sito e versione web su GitHub Pages: all'indirizzo principale il sito di presentazione (site/,
# costruito da site/build.mjs), in app/ la versione web stabile e in beta/ la beta
# (scripts/web-versions.mjs sceglie i tag; src/web, docs/web.md). Si costruisce sulle PR che toccano
# il codice o il sito e si pubblica a ogni tag v*, insieme alla release dell'app, oppure a mano
# (Actions → Web → Run workflow). Serve una volta Settings → Pages → Source: GitHub Actions.
name: Web

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - src/**
      - package.json
      - package-lock.json
      - vite.web.config.mts
      - tsconfig.webapp.json
      - scripts/web-versions.mjs
      - site/**
      - docs/guida/img/**
      - docs/guide/img/**
      - .github/workflows/web.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # servono i tag per scegliere le versioni da pubblicare
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # il sito di presentazione, dal codice corrente
      - name: Sito
        run: node site/build.mjs pages
      # sulle PR si costruisce solo il codice della PR, per controllarlo
      - name: Versione della PR
        if: github.event_name == 'pull_request'
        run: |
          npm ci --ignore-scripts
          npm run typecheck:webapp
          npx vite build -c vite.web.config.mts
          mkdir -p pages/app && cp -R out/web/. pages/app/
      - name: Versioni da pubblicare
        if: github.event_name != 'pull_request'
        run: node scripts/web-versions.mjs >> "$GITHUB_ENV"
      # ogni versione si costruisce dal suo tag, in una cartella a parte; senza gli script di
      # installazione: Electron qui non serve
      - name: Stabile e beta
        if: github.event_name != 'pull_request'
        run: |
          build() {
            rm -rf "build-$1"
            git worktree add --detach "build-$1" "$1"
            (cd "build-$1" && npm ci --ignore-scripts && npx vite build -c vite.web.config.mts)
          }
          echo "Stabile: $STABLE, beta: $BETA"
          build "$STABLE"
          mkdir -p pages/app && cp -R "build-$STABLE/out/web/." pages/app/
          if [ "$BETA" != "$STABLE" ]; then build "$BETA"; fi
          mkdir -p pages/beta && cp -R "build-$BETA/out/web/." pages/beta/
      # le versioni pubblicate prima della 1.3 cercano la beta in app/beta/ e la stabile alla radice
      - name: Rimandi per le versioni vecchie
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p pages/app/beta
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=../../beta/"><a href="../../beta/">beta</a>' > pages/app/beta/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
