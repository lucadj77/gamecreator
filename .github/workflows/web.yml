# Versione web (src/web, docs/web.md): si costruisce sulle PR che toccano il codice e si pubblica
# su GitHub Pages a ogni tag v*, insieme alla release dell'app, oppure a mano (Actions → Web →
# Run workflow). Il sito ha due versioni: la stabile all'indirizzo principale e la beta in beta/
# (scripts/web-versions.mjs sceglie i tag). Serve una volta Settings → Pages → Source: GitHub
# Actions.
name: Web

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - src/**
      - package.json
      - package-lock.json
      - vite.web.config.mts
      - tsconfig.webapp.json
      - scripts/web-versions.mjs
      - .github/workflows/web.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # servono i tag per scegliere le versioni da pubblicare
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # sulle PR si costruisce solo il codice della PR, per controllarlo
      - name: Versione della PR
        if: github.event_name == 'pull_request'
        run: |
          npm ci --ignore-scripts
          npm run typecheck:webapp
          npx vite build -c vite.web.config.mts
          mkdir -p site && cp -R out/web/. site/
      - name: Versioni da pubblicare
        if: github.event_name != 'pull_request'
        run: node scripts/web-versions.mjs >> "$GITHUB_ENV"
      # ogni versione si costruisce dal suo tag, in una cartella a parte; senza gli script di
      # installazione: Electron qui non serve
      - name: Stabile e beta
        if: github.event_name != 'pull_request'
        run: |
          build() {
            rm -rf "build-$1"
            git worktree add --detach "build-$1" "$1"
            (cd "build-$1" && npm ci --ignore-scripts && npx vite build -c vite.web.config.mts)
          }
          echo "Stabile: $STABLE, beta: $BETA"
          build "$STABLE"
          mkdir -p site && cp -R "build-$STABLE/out/web/." site/
          if [ "$BETA" != "$STABLE" ]; then build "$BETA"; fi
          mkdir -p site/beta && cp -R "build-$BETA/out/web/." site/beta/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
