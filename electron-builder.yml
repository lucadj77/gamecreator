appId: com.naibi.app
productName: Naibi
copyright: Copyright © 2026 Luca
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!{docs,examples,todo,scripts,skill,bin}/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: naibi
  # comando naibi da terminale e per gli agenti IA, accanto a naibi.exe (vedi docs/cli.md)
  extraFiles:
    - from: build/win/naibi-cli.cmd
      to: naibi-cli.cmd
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
portable:
  artifactName: ${productName}-${version}-windows-portable.${ext}
nsis:
  artifactName: ${productName}-${version}-windows-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  # apre la cartella di installazione agli agenti IA in sandbox (vedi build/win/installer.nsh)
  include: build/win/installer.nsh
mac:
  category: public.app-category.graphics-design
  # lo zip serve all'aggiornamento dall'app (src/main/updater.ts)
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # senza certificato Apple: firma ad hoc, necessaria perché l'app si avvii sui Mac con chip Apple
  identity: '-'
  hardenedRuntime: false
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Naibi opens and saves projects in your Documents folder.
    - NSDownloadsFolderUsageDescription: Naibi opens and saves projects in your Downloads folder.
  notarize: false
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  executableName: naibi
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  maintainer: Luca
  category: Graphics
  synopsis: Create cards and other game components
appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
deb:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
npmRebuild: false
# electron-updater (Windows setup e AppImage) legge latest.yml / beta.yml dalle release di GitHub;
# la build non pubblica nulla (--publish never), i file li carica il job release di build.yml
publish:
  provider: github
  owner: lucadj77
  repo: naibi
