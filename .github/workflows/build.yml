# Costruisce l'app per Mac, Windows e Linux. Si avvia a mano (Actions → Build → Run workflow),
# sulle PR che toccano la configurazione della build e su ogni tag v*: in quel caso i pacchetti
# finiscono in una release in bozza da pubblicare a mano.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - electron-builder.yml
      - package.json
      - package-lock.json
      - build/**
      - .github/workflows/build.yml

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # sulle PR electron-builder salta la firma; quella ad hoc del Mac non usa segreti e senza
          # macOS dice che l'app è danneggiata
          CSC_FOR_PULL_REQUEST: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: naibi-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
